# 生产部署：MySQL + FastAPI 后端 + 前端(nginx)
# 用法：docker compose -f docker-compose.prod.yml up -d --build
# 密码等敏感配置从同目录 .env 读取（.env 不入 git），首次部署先：cp .env.example .env 并修改
services:
  mysql:
    image: mysql:8.0
    container_name: lvxing-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-lvxing}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-13306}:3306"   # 仅本机可连（配合 Navicat SSH 隧道），公网不可达
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: lvxing-backend
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-lvxing}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: lvxing-frontend
    ports:
      - "${APP_PORT:-8080}:80"   # 浏览器访问 http://服务器IP:8080 ；想用 80 端口 .env 里设 APP_PORT=80
    depends_on:
      - backend
    restart: always

volumes:
  mysql_data:
